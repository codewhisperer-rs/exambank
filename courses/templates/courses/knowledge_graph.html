{% extends 'courses/base.html' %}

{% block title %}知识图谱 - 计算机考研题库{% endblock %}

{% block extra_js %}
<!-- 引入D3.js -->
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  #knowledge-graph {
    width: 100%;
    height: 900px;
    background-color: #f8f9fa;
    border-radius: 8px;
    margin-top: 20px;
  }
  
  .node {
    cursor: pointer;
  }
  
  .node text {
    font: 12px sans-serif;
    fill: #333;
    dominant-baseline: middle;
  }
  
  .link {
    fill: none;
    stroke: #ccc;
    stroke-width: 1px;
  }
  
  .tooltip {
    position: absolute;
    background-color: white;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 8px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  
  .controls {
    position: absolute;
    top: 10px;
    right: 10px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 10px;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }
  
  .controls button {
    margin: 2px;
    padding: 5px 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
  }
  
  .controls button:hover {
    background: #f0f0f0;
  }
  
  .radius-control {
    margin-top: 10px;
    display: flex;
    align-items: center;
  }
  
  .radius-control label {
    margin-right: 5px;
    font-size: 12px;
  }
  
  .radius-control input[type="range"] {
    width: 100px;
    margin-right: 5px;
  }
  
  .radius-control span {
    font-size: 12px;
    min-width: 30px;
    text-align: right;
  }
</style>
{% endblock %}

{% block content %}
<div class="container">
  <h1 class="my-4">知识图谱</h1>
  <p class="lead">以下展示了计算机考研课程的知识体系结构，从书籍到章节到小节的层级关系。</p>
  
  <div id="knowledge-graph" style="position: relative;">
    <div class="controls">
      <div>
        <button id="zoom-in">放大 +</button>
        <button id="zoom-out">缩小 -</button>
        <button id="reset-zoom">重置</button>
      </div>
      <div class="radius-control">
        <label for="radius-slider">半径:</label>
        <input type="range" id="radius-slider" min="100" max="500" value="300">
        <span id="radius-value">300</span>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // 从Django模板获取图谱数据
  const graphData = {{ graph_data|safe }};
  
  // 设置SVG容器
  const width = document.getElementById('knowledge-graph').clientWidth;
  const height = document.getElementById('knowledge-graph').clientHeight;
  let currentRadius = 300; // 初始半径
  
  // 创建SVG
  const svg = d3.select('#knowledge-graph')
    .append('svg')
    .attr('width', width)
    .attr('height', height);
  
  // 创建一个容器组，用于缩放和平移
  const g = svg.append('g')
    .attr('transform', 'translate(' + (width / 2) + ',' + (height / 2) + ')');
  
  // 添加缩放和平移功能
  const zoom = d3.zoom()
    .scaleExtent([0.1, 3]) // 设置缩放范围
    .on('zoom', function(event) {
      g.attr('transform', 'translate(' + event.transform.x + ',' + event.transform.y + ') scale(' + event.transform.k + ')');
    });
  
  // 应用缩放行为到SVG
  svg.call(zoom);
  
  // 控制按钮功能
  document.getElementById('zoom-in').addEventListener('click', function() {
    svg.transition().duration(300).call(zoom.scaleBy, 1.2);
  });
  
  document.getElementById('zoom-out').addEventListener('click', function() {
    svg.transition().duration(300).call(zoom.scaleBy, 0.8);
  });
  
  document.getElementById('reset-zoom').addEventListener('click', function() {
    svg.transition().duration(300)
      .call(zoom.transform, d3.zoomIdentity.translate(width / 2, height / 2));
  });
  
  // 半径滑块功能
  const radiusSlider = document.getElementById('radius-slider');
  const radiusValueSpan = document.getElementById('radius-value');
  
  radiusSlider.addEventListener('input', function() {
    currentRadius = +this.value;
    radiusValueSpan.textContent = currentRadius;
    updateGraph(currentRadius);
  });
  
  // 准备层次数据
  const hierarchyData = convertToHierarchy(graphData);
  const root = d3.hierarchy(hierarchyData);
  
  // 创建提示框
  const tooltip = d3.select('body')
    .append('div')
    .attr('class', 'tooltip');
  
  // 绘制图谱的函数
  function updateGraph(radius) {
    // 清除旧的图形元素
    g.selectAll('.node').remove();
    g.selectAll('.link').remove();
    
    // 使用径向树形布局
    const tree = d3.tree()
      .size([2 * Math.PI, radius])
      .separation(function(a, b) { 
        return (a.parent == b.parent ? 2 : 3) / a.depth; 
      });
    
    // 应用布局
    const treeData = tree(root);
    
    // 创建径向连接线生成器
    const linkGenerator = d3.linkRadial()
      .angle(function(d) { return d.x; })
      .radius(function(d) { return d.y; });
    
    // 绘制连接线
    g.selectAll('.link')
      .data(treeData.links())
      .enter()
      .append('path')
      .attr('class', 'link')
      .attr('d', linkGenerator);
    
    // 创建节点组
    const node = g.selectAll('.node')
      .data(treeData.descendants())
      .enter()
      .append('g')
      .attr('class', function(d) { 
        return 'node node-' + d.data.type; 
      })
      .attr('transform', function(d) { 
        return 'translate(' + radialPoint(d.x, d.y) + ')'; 
      })
      .on('mouseover', function(event, d) {
        tooltip.transition()
          .duration(200)
          .style('opacity', 0.9);
        tooltip.html(d.data.name)
          .style('left', (event.pageX + 10) + 'px')
          .style('top', (event.pageY - 28) + 'px');
      })
      .on('mouseout', function() {
        tooltip.transition()
          .duration(500)
          .style('opacity', 0);
      })
      .on('click', function(event, d) {
        // 根据节点类型和ID跳转到相应页面
        if (d.data.type === 'book') {
          const bookId = d.data.id.split('_')[1];
          window.open('/book/' + bookId + '/', '_blank');
        } else if (d.data.type === 'chapter') {
          const chapterId = d.data.id.split('_')[1];
          window.open('/chapter/' + chapterId + '/', '_blank');
        } else if (d.data.type === 'section') {
          const sectionId = d.data.id.split('_')[1];
          window.open('/section/' + sectionId + '/', '_blank');
        }
      });
    
    // 添加节点圆圈
    node.append('circle')
      .attr('r', function(d) {
        if (d.data.type === 'center') return 22;
        if (d.data.type === 'book') return 16;
        if (d.data.type === 'chapter') return 10;
        return 6;
      })
      .attr('fill', function(d) {
        if (d.data.type === 'center') return '#ff7f0e';
        if (d.data.type === 'book') return '#1f77b4';
        if (d.data.type === 'chapter') return '#2ca02c';
        return '#d62728';
      })
      .attr('stroke', function(d) {
        if (d.data.type === 'center') return '#ff6600';
        if (d.data.type === 'book') return '#0c4e8d';
        if (d.data.type === 'chapter') return '#1a801a';
        return '#a61b1c';
      })
      .attr('stroke-width', 1.5);
  
    // 创建辅助背景，确保文本可见度
    node.append('rect')
      .attr('class', 'text-background')
      .attr('x', function(d) {
        return d.x < Math.PI === !d.children ? 10 : -120; 
      })
      .attr('y', -10)
      .attr('width', function(d) {
        const textLength = d.data.name.length * 12; // 估算文本宽度
        return d.children ? textLength : Math.min(textLength, 110); // 调整叶子节点背景宽度
      })
      .attr('height', 20)
      .attr('fill', 'white')
      .attr('fill-opacity', 0.7)
      .attr('rx', 5)
      .attr('ry', 5)
      .attr('transform', function(d) {
        const angle = d.x * 180 / Math.PI - 90;
        const rotate = angle + (d.x < Math.PI ? 0 : 180);
        return 'rotate(' + rotate + ')';
      });
      
    // 添加节点文本
    node.append('text')
      .attr('dy', '.31em')
      .attr('x', function(d) {
        return d.x < Math.PI === !d.children ? 10 : -10;
      })
      .attr('text-anchor', function(d) {
        return d.x < Math.PI === !d.children ? 'start' : 'end';
      })
      .attr('transform', function(d) {
        const angle = d.x * 180 / Math.PI - 90;
        const rotate = angle + (d.x < Math.PI ? 0 : 180);
        return 'rotate(' + rotate + ')';
      })
      .text(function(d) {
        return d.data.name;
      });
  }
  
  // 初始绘制
  updateGraph(currentRadius);
  
  // 帮助函数：将直角坐标转换为极坐标
  function radialPoint(x, y) {
    return [(y = +y) * Math.cos(x -= Math.PI / 2), y * Math.sin(x)];
  }
  
  // 帮助函数：将图谱数据转换为层次结构
  function convertToHierarchy(data) {
    var hierarchyRoot = {
      name: data.center.name,
      type: 'center',
      children: []
    };
    
    // 添加书籍节点
    data.books.forEach(function(book) {
      if (!book.children || book.children.length === 0) return; // 如果书下没有有效章节，则跳过
      var bookNode = {
        name: book.name,
        id: book.id,
        type: 'book',
        children: []
      };
      
      // 添加章节节点
      book.children.forEach(function(chapter) {
        if (!chapter.children || chapter.children.length === 0) return; // 如果章节下没有有效小节，则跳过
        var chapterNode = {
          name: chapter.name,
          id: chapter.id,
          type: 'chapter',
          children: []
        };
        
        // 添加小节节点
        chapter.children.forEach(function(section) {
          var sectionNode = {
            name: section.name,
            id: section.id,
            type: 'section'
          };
          chapterNode.children.push(sectionNode);
        });
        
        bookNode.children.push(chapterNode);
      });
      
      hierarchyRoot.children.push(bookNode);
    });
    
    return hierarchyRoot;
  }
});
</script>
{% endblock %}
